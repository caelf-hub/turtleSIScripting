name: lerobot

# Used by VS Code / Cursor Dev Containers.
# On Windows run Terminal → Run Task → Setup LeRobot (Docker + USB) first so
# usbipd has attached both adapters and docker/.env exists for interpolation.

services:
  lerobot:
    image: ${LEROBOT_IMAGE:-huggingface/lerobot-cpu:latest}
    privileged: true
    group_add:
      - dialout
    stdin_open: true
    tty: true
    working_dir: /workspaces/lerobot
    volumes:
      - /dev:/dev
      - ..:/workspaces/lerobot
    environment:
      LEROBOT_FOLLOWER_PORT: ${LEROBOT_FOLLOWER_PORT:-/dev/ttyACM0}
      LEROBOT_LEADER_PORT: ${LEROBOT_LEADER_PORT:-/dev/ttyACM1}
      PYTHONPATH: /workspaces/lerobot/src
    env_file:
      - path: .env
        required: false
    command: /bin/bash
